# Include inside an existing HTTPS server {} block.
# Configure ZQY_ALLOWED_HOSTS and ZQY_TRUST_PROXY=1 on the backend.
# Create /etc/nginx/zhiqingyu.htpasswd before enabling these locations.
location /zhiqingyu/ {
    auth_basic "ZhiQingYu";
    auth_basic_user_file /etc/nginx/zhiqingyu.htpasswd;
    alias /usr/share/nginx/html/zhiqingyu/;
    index index.html;
    add_header Cache-Control "no-cache";
}

location /zhiqingyu/api/ {
    auth_basic "ZhiQingYu";
    auth_basic_user_file /etc/nginx/zhiqingyu.htpasswd;
    client_max_body_size 32m;
    proxy_pass http://127.0.0.1:8092/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 660s;
}
